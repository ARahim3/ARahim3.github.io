<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&amp;display=swap');
      text { font-family: 'Newsreader', 'Source Serif 4', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#faf8f3"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#e6e2dc" stroke-width="1"/>

  <!-- eyebrow -->
  <rect x="130" y="98" width="36" height="2.5" fill="#2e9d6c"/>
  <text class="mono" x="178" y="107" font-size="15" font-weight="500" letter-spacing="2.5" fill="#8a8682">ABDUR RAHIM · OPEN SOURCE</text>

  <!-- title -->
  <text class="mono" x="124" y="228" font-size="88" font-weight="600" letter-spacing="-3" fill="#2a2725">projects</text>
  <rect x="540" y="164" width="30" height="66" fill="#2e9d6c"/>

  <!-- subtitle -->
  <text x="130" y="292" font-size="29" font-style="italic" fill="#5e5a58">Most of them started as things I needed myself.</text>

  <!-- project list, two columns -->
  <g font-size="21">
    <text class="mono" x="130" y="372" fill="#2e9d6c">→</text><text class="mono" x="162" y="372" fill="#2a2725">mlx-tune</text>
    <text class="mono" x="130" y="412" fill="#2e9d6c">→</text><text class="mono" x="162" y="412" fill="#2a2725">mlx-dspark</text>
    <text class="mono" x="130" y="452" fill="#2e9d6c">→</text><text class="mono" x="162" y="452" fill="#2a2725">kaggle-tpu-lab</text>
    <text class="mono" x="560" y="372" fill="#2e9d6c">→</text><text class="mono" x="592" y="372" fill="#2a2725">lekho</text>
    <text class="mono" x="560" y="412" fill="#2e9d6c">→</text><text class="mono" x="592" y="412" fill="#2a2725">omniASR-server</text>
    <text class="mono" x="560" y="452" fill="#2e9d6c">→</text><text class="mono" x="592" y="452" fill="#2a2725">supertonic-server</text>
  </g>

  <!-- footer -->
  <line x1="130" y1="510" x2="1070" y2="510" stroke="#e6e2dc" stroke-width="1"/>
  <text class="mono" x="130" y="552" font-size="17" fill="#8a8682">mlx · jax · tpu · speech</text>
  <text class="mono" x="1070" y="552" font-size="17" fill="#2a2725" text-anchor="end">arahim3.github.io/projects</text>
</svg>
