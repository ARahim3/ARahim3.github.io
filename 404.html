        <meta name="robots" content="noindex" />
        <title>Page not found — Abdur Rahim</title>

        <script>
            // GitHub Pages paths are case-sensitive and Lekho's site is the
            // ARahim3/Lekho repo, served at /Lekho/. Send /lekho, /LEKHO/bn/ …
            // there instead of showing a 404.
            (function () {
                var p = location.pathname;
                if (/^\/lekho(\/|$)/i.test(p) && p.indexOf("/Lekho") !== 0) {
                    location.replace("/Lekho" + p.slice(6) + location.search + location.hash);
                }
            })();
        </script>

            rel="stylesheet"
        />
