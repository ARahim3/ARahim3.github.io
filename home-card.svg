<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&amp;display=swap');
      text { font-family: 'Newsreader', 'Source Serif 4', Georgia, serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#faf8f3"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#e6e2dc" stroke-width="1"/>

  <!-- eyebrow -->
  <rect x="130" y="98" width="36" height="2.5" fill="#2e9d6c"/>
  <text class="mono" x="178" y="107" font-size="15" font-weight="500" letter-spacing="2.5" fill="#8a8682">SENIOR AI ENGINEER · BANGLADESH → REMOTE</text>

  <!-- name with the site's terminal caret -->
  <text class="mono" x="124" y="248" font-size="96" font-weight="600" letter-spacing="-3" fill="#2a2725">abdur rahim</text>
  <rect x="746" y="178" width="34" height="72" fill="#2e9d6c"/>

  <!-- subtitle -->
  <text x="130" y="322" font-size="29" font-style="italic" fill="#5e5a58">Open-source tools for MLX on the Mac and JAX on TPUs,</text>
  <text x="130" y="360" font-size="29" font-style="italic" fill="#5e5a58">real-time voice agents by day, and long-form writing.</text>

